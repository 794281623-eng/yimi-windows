<h1>压条有点小缝隙，打上胶是不是就可以盖住？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>打胶只能辅助密封，不能用来弥补压条装配错位、翘边的问题，基础贴合不到位，胶层容易开裂失效。</p>
