<h1>急单和现有订单冲突，该怎么处理？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>先核对工厂排期，确认是否有承接空间。如果接不下，坦诚告知客户，不要硬接导致延期；能承接的，同步协调好原有订单的进度，做好沟通。</p>
<p>不同城市、不同朝向的房子差别不小，别照搬别人的配置，现场确认更靠谱。</p>
