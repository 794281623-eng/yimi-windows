<h1>横置扁窗泄水孔是不是越多越好？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>不是，泄水孔要均匀排布，开孔位置合适。过多的孔位会影响框体气密，孔位太少又排水不畅，需要结合窗宽和腔体方案合理设置。</p>
<p>不同城市、不同朝向的房子差别不小，别照搬别人的配置，现场确认更靠谱。</p>
