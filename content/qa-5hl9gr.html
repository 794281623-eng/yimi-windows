<h1>自建房一层窗框可以直接落在地面上吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>不建议直接落地，窗框底部要预留排水空间，做好高差和挡水结构，不然雨水、地面潮气容易顺着缝隙渗进室内，增加渗水发霉的概率。</p>
<p>如果有条件，跑一趟工厂看看型材和加工工序，心里会踏实很多。</p>
