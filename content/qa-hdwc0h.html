<h1>门窗胶条老化之后，只能整扇窗换掉吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>多数情况可以单独更换胶条，不用换掉整窗。发现胶条发硬、开裂、脱开，尽早安排更换，避免雨水顺着缝隙渗进墙体，造成墙面或者柜体受潮。</p>
