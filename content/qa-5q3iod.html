<h1>已经出现胶线开裂断缝，怎么补救影音房漏音？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>先剔除老化脱落的旧胶，清理干净缝隙基面，再重新打连续密封胶。如果缝隙偏大，可以配合填充材料之后再收口，减少低音透过缝隙传导。</p>
<p>我自己的做法是：先把户型和需求理清楚，再带着问题去现场问，效率高很多。</p>
