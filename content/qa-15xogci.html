<h1>幕墙转接件生锈之后，还能直接刷漆修复吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>不能直接刷漆，要先把锈蚀清理干净，打磨到完好基材，再做配套防腐处理，锈蚀严重的构件，需要评估是否更换，不能只做表面遮盖。</p>
<p>不同城市、不同朝向的房子差别不小，别照搬别人的配置，现场确认更靠谱。</p>
