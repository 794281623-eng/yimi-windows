<h1>江景房原位换窗，拆旧窗弄坏外墙还能补救吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>可以补救，但比较麻烦。外墙防水层破损后，要先清理松动基层，重新做外墙防水收口，验收无误之后再安装新窗，不然临江多雨环境下很容易持续渗水。</p>
<p>不同城市、不同朝向的房子差别不小，别照搬别人的配置，现场确认更靠谱。</p>
