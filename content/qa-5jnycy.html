<h1>复式窗中梃位置后期渗水，一般怎么处理？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>先排查原有密封胶有没有开裂脱落，清理干净旧胶后重新打耐候密封胶。如果是内部排水结构问题，需要由专业人员评估，不要自行封堵排水孔。</p>
<p>不同城市、不同朝向的房子差别不小，别照搬别人的配置，现场确认更靠谱。</p>
