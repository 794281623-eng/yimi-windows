<h1>沿海窗户日常保养，怎么减少盐雾带来的腐蚀？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>定期用清水冲洗窗框与外露五金，冲掉附着在表面的盐分。每年检查外侧密封胶，出现开裂及时补胶，保持排水孔通畅，不要让雨水长期积存在窗框内部。</p>
