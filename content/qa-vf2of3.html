<h1>外墙防水修补之后，还需要额外做什么？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>修补完成后要预留养护时间，干透再进行窗框安装。窗框安装完成，外侧再打耐候密封胶，形成双层防护，降低雨水渗入的概率。</p>
<p>如果有条件，跑一趟工厂看看型材和加工工序，心里会踏实很多。</p>
