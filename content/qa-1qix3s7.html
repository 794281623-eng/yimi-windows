<h1>合伙开店，没写进授权的合伙人，可以对外接单吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>接单对外使用品牌名义，只能由授权登记主体对接。其他合伙人可以在内部协作经营，但对外的合同、资质文件都要和登记主体保持一致。</p>
<p>合作这件事看的是长期供货和售后响应，实地看过车间，心里会有判断。</p>
