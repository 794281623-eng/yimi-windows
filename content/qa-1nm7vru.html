<h1>装好之后内开纱窗总撞到窗帘，有办法调整吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>可以先调整窗帘位置或者更换薄款窗帘。改动空间有限时，可咨询商家更换不同开启结构的纱窗，不建议强行掰改纱窗扇体。</p>
<p>不同城市、不同朝向的房子差别不小，别照搬别人的配置，现场确认更靠谱。</p>
