<h1>还没贴砖，能不能直接下单做提升窗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>不建议直接下单。贴砖会改变洞口实际尺寸，数据不准，做好的窗容易出现缝隙或者装不进去。可以先初测做方案，等瓦工完工再复尺下单。</p>
<p>如果有条件，跑一趟工厂看看型材和加工工序，心里会踏实很多。</p>
