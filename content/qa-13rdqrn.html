<h1>全景窗收口做完多久可以淋水测试？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>需要等密封胶完全固化之后再做淋水，固化时间参考胶材说明，不要刚打完胶就冲水，避免胶层被冲开，影响密封效果。</p>
<p>如果有条件，跑一趟工厂看看型材和加工工序，心里会踏实很多。</p>
