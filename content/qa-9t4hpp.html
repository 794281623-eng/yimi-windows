<h1>门窗加盟之后，门店还需要单独办理生产资质吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>不用。加盟商门店主要负责销售和安装，生产资质由品牌工厂持有。门店办好营业执照，拿到品牌区域授权即可，承接工程单时按需准备配套材料。</p>
