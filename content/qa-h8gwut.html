<h1>窗边密封胶开裂了，直接补胶就可以吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>需要先把老化开裂的旧胶清理干净，再打新的耐候密封胶。如果内部填充已经空洞，只补表面胶，隔音防渗效果依旧不理想。</p>
<p>我自己的做法是：先把户型和需求理清楚，再带着问题去现场问，效率高很多。</p>
