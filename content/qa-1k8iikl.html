<h1>窗边收口已经开裂，还能补救隔音吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>可以清理开裂位置，填充适配的密封材料再做表层收口。如果缝隙很深，优先确认窗框外侧密封完好，再处理室内一侧，降噪效果会更好。</p>
<p>配什么、怎么装，还得看自家楼层、朝向和临街情况，现场量过才好定。</p>
