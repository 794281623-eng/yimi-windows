<h1>自建房墙体是加气块，装窗会不会容易掉？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>加气块本身承力弱，不能直接打普通膨胀螺丝，要选用配套固定配件，固定点位尽量落在混凝土梁柱或者实心砖位置，做好加固，降低松动风险。</p>
<p>如果有条件，跑一趟工厂看看型材和加工工序，心里会踏实很多。</p>
