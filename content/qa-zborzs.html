<h1>毛坯房装窗，能不能等墙面全部贴完砖再装？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>不建议。贴完砖后窗框外侧很难做抹灰收口，防水容易薄弱。优先粗抹灰后装窗框，再顺着窗框做收口，密封和防水会更稳妥。</p>
