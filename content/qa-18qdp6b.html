<h1>红砖门柱加固之后，可以装重型庭院门吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>红砖门柱本身承载力偏弱，即便加固，也不建议装大尺寸重型庭院门，优先混凝土浇筑门柱，降低门扇下垂、门柱变形的风险。</p>
<p>如果有条件，跑一趟工厂看看型材和加工工序，心里会踏实很多。</p>
