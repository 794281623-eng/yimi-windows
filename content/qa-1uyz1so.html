<h1>大落地窗选多厚的玻璃合适？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>玻璃厚度根据窗户的宽度、高度和所在楼层来定，尺寸越大、楼层越高，需要的玻璃厚度就越大，还要确认是否需要做加强筋。具体配置可以让厂家根据实际开窗尺寸核算。</p>
<p>配什么、怎么装，还得看自家楼层、朝向和临街情况，现场量过才好定。</p>
