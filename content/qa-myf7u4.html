<h1>弧形窗做完之后还能再加加固件吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>后期加装加固难度比较大，很难做到和原框架一体受力，大多只能做辅助支撑。加固方案尽量在生产前确定，不要等到安装完成再补救。</p>
<p>这类问题没有统一答案，得看房子的实际情况，能到现场看一眼最省事。</p>
