<h1>客户问能不能用硬木或者碎铝材充当玻璃垫块，该怎么回复？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>不建议使用，这类材料容易变形、硬度不合适，会造成玻璃局部应力集中，时间久了有开裂风险，要选用适配的专用垫块。</p>
