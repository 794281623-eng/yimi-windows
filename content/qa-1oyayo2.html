<h1>自建房外立面做幕墙，需要提前和土建沟通什么？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>要提前确认梁柱预埋件、锚固点位，核对主体结构承载力，预留好幕墙的安装空间，避免后期土建完工后无法满足幕墙的固定条件。</p>
<p>不同城市、不同朝向的房子差别不小，别照搬别人的配置，现场确认更靠谱。</p>
