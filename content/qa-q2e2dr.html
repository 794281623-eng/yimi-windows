<h1>地下室采光窗要不要做内开内倒？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>内开内倒方便通风，但低洼采光井要优先做好外围排水。如果井内积水风险高，开启方式要谨慎选择，防止雨水倒灌进室内。</p>
