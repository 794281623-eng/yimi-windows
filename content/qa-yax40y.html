<h1>大玻璃表面细微划痕，会不会慢慢变成裂纹？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>表面轻微划痕一般不会直接开裂，但如果是边角位置的崩口、暗裂，在江边温差和风压持续作用下，损伤会持续延伸，这类玻璃不建议直接安装。</p>
<p>不同城市、不同朝向的房子差别不小，别照搬别人的配置，现场确认更靠谱。</p>
