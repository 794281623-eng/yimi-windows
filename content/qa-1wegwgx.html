<h1>窗边外墙胶已经开裂，直接在旧胶上面补一层有用吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>不建议直接在旧胶表面补打。旧胶附着力已经失效，新胶很难粘牢。需要把老化开裂的胶全部剔除，清理干净基面，再重新打胶封闭。</p>
<p>我自己的做法是：先把户型和需求理清楚，再带着问题去现场问，效率高很多。</p>
