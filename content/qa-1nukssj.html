<h1>已经装好的窗户，组角位置渗水还能补救吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>优先清理组角外侧旧胶，重新清理干净后打适配户外的密封胶封堵。如果是内部注胶缺失，修补效果有限，渗水反复就要评估方案。</p>
<p>如果有条件，跑一趟工厂看看型材和加工工序，心里会踏实很多。</p>
