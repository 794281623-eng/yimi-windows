<h1>已经装好的手动庭院门，还能加装电动开门机吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>可以加装，但要先核验门柱加固情况、门扇状态以及供电条件。门扇如果已经下垂、变形，不建议直接加装，要先调校门扇再考虑驱动装置。</p>
<p>我自己的做法是：先把户型和需求理清楚，再带着问题去现场问，效率高很多。</p>
