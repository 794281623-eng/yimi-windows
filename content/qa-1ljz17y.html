<h1>一楼庭院推拉门，门槛越高防水就越好吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>不是越高越好，门槛过高会影响日常进出。重点是做好挡水结构、轨道泄水、外侧耐候密封，同时配合院子向外的排水坡度，多重配合才能减少雨水倒灌。</p>
<p>不同城市、不同朝向的房子差别不小，别照搬别人的配置，现场确认更靠谱。</p>
