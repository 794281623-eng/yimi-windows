<h1>楼梯高位窗，全部做固定玻璃可以吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>可以，如果周边有其他窗户负责通风，高位窗只做固定完全没问题。但全屋通风点位偏少的话，建议预留少量开启扇，保证室内空气流通。</p>
<p>不同城市、不同朝向的房子差别不小，别照搬别人的配置，现场确认更靠谱。</p>
