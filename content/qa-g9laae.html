<h1>细纱网破了，能不能单独更换成粗一点的纱网？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>多数情况下可以单独更换纱网，但是要匹配原有纱扇卡槽尺寸。更换后对比推拉、闭合状态，确认不会影响纱窗的密封和滑动。</p>
<p>不同城市、不同朝向的房子差别不小，别照搬别人的配置，现场确认更靠谱。</p>
