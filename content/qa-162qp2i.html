<h1>老高层旧房换窗，需要先修补墙体洞口吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>要看洞口状态，如果墙体开裂、尺寸歪斜，建议先做修补找平，再安装新窗。规整的洞口，填充和密封才能做得更好，隔音和防渗效果都会更稳。</p>
<p>不同城市、不同朝向的房子差别不小，别照搬别人的配置，现场确认更靠谱。</p>
