<h1>已经砌好墙，还能做弧形窗预埋加固吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>可以，只是施工方式会有变化，多采用后置加固方案。后置固定的承载力和预埋有区别，洞口偏大或者高层户型，一定要提前评估墙体条件。</p>
<p>不同城市、不同朝向的房子差别不小，别照搬别人的配置，现场确认更靠谱。</p>
