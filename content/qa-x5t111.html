<h1>已经装好的窗边收口开裂，还能重新处理吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>可以，需要把开裂、空鼓的旧材料清理干净，重新填充密封，做好表层收口。处理完成后，最好同步测试隔音和防水状态。</p>
<p>我自己的做法是：先把户型和需求理清楚，再带着问题去现场问，效率高很多。</p>
