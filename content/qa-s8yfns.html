<h1>纱窗很久没洗，积灰很重，自己在家怎么清洗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>能拆的纱扇取下来，用软毛刷轻扫，再用低压清水冲洗，放在通风处阴干。不要用力揉搓纱网，避免纱网变形、勾丝。</p>
