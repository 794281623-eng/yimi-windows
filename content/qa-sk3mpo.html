<h1>客户说执手有点松，能不能直接拧紧螺丝就完事？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>可以先紧固螺丝，但要同步检查锁点对位。如果锁点本身偏移，只拧螺丝治标不治本，后续还会反复打滑松动。</p>
<p>这类问题没有统一答案，得看房子的实际情况，能到现场看一眼最省事。</p>
