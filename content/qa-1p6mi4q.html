<h1>复式挑高阳台推拉门，玻璃一定要做夹胶吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>不是强制要求，但挑高位置建议优先考虑夹胶钢化玻璃，就算玻璃意外碎裂，碎片不容易散落，安全性更好。临街户型选用夹胶玻璃，降噪效果也会更好。</p>
<p>不同城市、不同朝向的房子差别不小，别照搬别人的配置，现场确认更靠谱。</p>
