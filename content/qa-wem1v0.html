<h1>夹胶玻璃是不是就完全听不到低频噪音了？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>夹胶玻璃可以削弱低频噪音，但没法做到完全隔绝。低频噪音还会通过墙体震动传导，需要搭配密封、缓冲等方案一起改善。</p>
<p>这类问题没有统一答案，得看房子的实际情况，能到现场看一眼最省事。</p>
