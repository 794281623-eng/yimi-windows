<h1>窗户胶条局部开裂，可以单独换一段吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>不建议只换一小段，新旧胶条弹性、收缩程度不一样，拼接位置依然容易渗水，优先整圈更换适配海边环境的密封胶条。</p>
