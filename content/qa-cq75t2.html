<h1>同城市开分店，主体不变，还要重新签加盟合同吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>不一定需要重新签主合同，但新店点位必须提交资料备案，完成审核，补齐新店对应的授权文件，具体规则可以和品牌渠道沟通确认。</p>
