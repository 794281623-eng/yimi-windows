<h1>土建已经完工，还能加装后置锚栓做幕墙吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>可以，但要先做结构核验，确认梁柱承载力满足锚固要求，后置锚栓的规格、间距都要符合方案，不能直接凭经验施工。</p>
<p>我自己的做法是：先把户型和需求理清楚，再带着问题去现场问，效率高很多。</p>
