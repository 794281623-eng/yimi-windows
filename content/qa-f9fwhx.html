<h1>纱窗轨道已经卡滞推不动，怎么简单处理？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>先用毛刷、吸尘器清理轨道内泥沙，清理干净之后再轻推，不要强行用力推拉。清理后依旧卡顿，再安排师傅上门检查。</p>
<p>我自己的做法是：先把户型和需求理清楚，再带着问题去现场问，效率高很多。</p>
