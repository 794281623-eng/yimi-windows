<h1>密封门窗装好之后，多久可以做淋水测试？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>一般等密封胶充分固化之后再做淋水测试会更合适。测试时重点查看窗框边角、拼接位置，观察有没有渗水痕迹。如果发现渗水，及时让施工方调整密封处理，避免后期潮湿天气出现渗漏问题。</p>
