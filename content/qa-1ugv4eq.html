<h1>窗户执手松动，自己拧紧螺丝就可以吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>轻微松动可以先拧紧固定螺丝，拧紧后测试开关是否顺畅。如果锁点依旧咬合错位，不要强行使用，整套方案，需按产品配置与地区由官方渠道确认。</p>
