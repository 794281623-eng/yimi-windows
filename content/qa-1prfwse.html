<h1>弧形窗外墙胶多久需要重新补打？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>没有固定周期，平时多留意胶面有没有开裂、起翘、脱粘。一旦发现破损，及时清理旧胶重新施工，避免雨水顺着缝隙渗入窗框内部。</p>
<p>不同城市、不同朝向的房子差别不小，别照搬别人的配置，现场确认更靠谱。</p>
