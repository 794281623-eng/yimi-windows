<h1>靠山别墅门窗起雾，是玻璃质量差吗？</h1>

<p>不一定。玻璃、密封胶条、排水结构、型材腔体设计都会影响结露，很多时候是水汽顺着缝隙渗入，或者冷热桥没有做好，不能只怪玻璃。</p>
