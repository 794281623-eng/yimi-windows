<h1>做县城旧房换窗生意，怎么降低上门勘测的失误？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>上门时多方位记录洞口尺寸，留意墙体、瓷砖情况，标记管线位置。提前和住户确认拆旧防护方案，核对清楚再下单，减少后期尺寸不合、施工磕碰的问题。</p>
<p>不同城市、不同朝向的房子差别不小，别照搬别人的配置，现场确认更靠谱。</p>
