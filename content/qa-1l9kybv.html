<h1>沿海外密封胶开裂之后，自己可以直接补打吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>不建议直接往上覆盖打胶，要先把老化失效的旧胶清理干净，基面擦拭晾干，再重新施工，不然新胶很难粘牢固。</p>
<p>如果有条件，跑一趟工厂看看型材和加工工序，心里会踏实很多。</p>
