<h1>门窗排水孔堵住了，自己怎么处理？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>先用软毛刷清理表面杂物，再用细软管轻轻疏通，不要用坚硬物品戳破内部结构。清理完成后，用清水冲掉残留盐粒，保持排水通畅。</p>
