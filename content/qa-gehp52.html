<h1>阳光房密封胶发霉了，直接在外面补一层胶有用吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>如果原有胶层已经脱粘、开裂，直接在外补胶效果有限。要把老化胶体清理干净，擦干基面，再重新施胶。若水汽已经积在内部，还需要先排查里面的密封结构问题。</p>
<p>不同城市、不同朝向的房子差别不小，别照搬别人的配置，现场确认更靠谱。</p>
