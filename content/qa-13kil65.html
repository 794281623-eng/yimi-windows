<h1>影音房窗户已经装好，缝隙漏音该怎么补救？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>先检查密封胶是否开裂、胶条有无老化变形，锁点关闭后能否压紧扇体。缝隙问题可以补胶或者更换胶条；锁具松动，联系师傅调试锁点，减少声音外泄。</p>
<p>我自己的做法是：先把户型和需求理清楚，再带着问题去现场问，效率高很多。</p>
