<h1>庭院门五金出现轻微异响，直接上润滑油可以吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>可以少量使用适配户外的润滑产品，先清理缝隙里泥沙杂物。如果是五金松动、受力变形导致的异响，单纯润滑无法根治，需要重新调试固定。</p>
<p>这类问题没有统一答案，得看房子的实际情况，能到现场看一眼最省事。</p>
