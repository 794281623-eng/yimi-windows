<h1>天窗做固定玻璃还是开启款更好？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>只用来采光可以选固定款，结构简单、故障率更低；天井、地下室这类潮湿空间，优先选开启款，方便通风排湿，开启款要重点核对五金和排水设计。</p>
<p>我自己的做法是：先把户型和需求理清楚，再带着问题去现场问，效率高很多。</p>
