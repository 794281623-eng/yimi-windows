<h1>工程门窗分批交货，进场验收要注意什么？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>每一批到货后，对照封样核对型材、玻璃、五金规格，检查外观色差。同时核对发货清单，记录货品状态，有问题第一时间反馈工厂对接人员，减少后期验收争议。</p>
