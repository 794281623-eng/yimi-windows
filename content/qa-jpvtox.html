<h1>已经装好窗户，后期还能再加附框吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>不可以。附框属于预埋构件，要在门窗进场之前提前做好。已经完成窗框安装，只能做好外围密封维护，定期检查胶缝状态。</p>
<p>我自己的做法是：先把户型和需求理清楚，再带着问题去现场问，效率高很多。</p>
