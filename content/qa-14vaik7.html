<h1>窗边密封胶开裂了，可以直接在上面补打一层吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>不建议直接覆盖补胶，旧胶附着力变差，新胶很难粘牢。需要把开裂、脱胶的部分清理干净，基面处理妥当后重新打胶，密封效果才稳定。</p>
<p>如果有条件，跑一趟工厂看看型材和加工工序，心里会踏实很多。</p>
