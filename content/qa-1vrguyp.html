<h1>窗框收口做完之后，怎么简单检查会不会渗水？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>可以在外侧密封胶位置查看有无开裂、断胶，胶和墙体、窗框贴合紧密。条件允许可以淋水观察，发现渗水痕迹及时返工处理。</p>
<p>我自己的做法是：先把户型和需求理清楚，再带着问题去现场问，效率高很多。</p>
