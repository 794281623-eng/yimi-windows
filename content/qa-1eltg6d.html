<h1>一楼院子门窗验收，遇到密封胶有气泡怎么办？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>密封胶出现气泡、断胶，会降低防水能力，需要把原有胶层剔除清理干净，重新打胶，等胶层完全固化之后再复核，避免后期渗水。</p>
