<h1>已经装好的窗户，角部没有注胶可以补救吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>后期只能在外缝打密封胶做表层封堵，没办法实现内部注胶的一体效果。长期使用，型材形变之后，渗漏、漏风的风险依旧存在。</p>
<p>这类问题没有统一答案，得看房子的实际情况，能到现场看一眼最省事。</p>
