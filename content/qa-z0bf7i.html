<h1>地台矮窗底部可以直接用石材把排水孔盖住吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>不可以，排水孔要保持通畅，石材收口要预留出水空间，雨水、溅水才能顺利排出去，堵住之后积水会慢慢渗进室内。</p>
<p>不同城市、不同朝向的房子差别不小，别照搬别人的配置，现场确认更靠谱。</p>
