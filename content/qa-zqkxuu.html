<h1>门窗安装出现渗水怎么处理？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>如果是窗边密封胶开裂导致的渗水，可以清理旧胶后重新打耐候硅酮胶；如果是洞口填充不实导致的，需要重新清理缝隙填充发泡胶，再做内外密封。</p>
<p>配什么、怎么装，还得看自家楼层、朝向和临街情况，现场量过才好定。</p>
