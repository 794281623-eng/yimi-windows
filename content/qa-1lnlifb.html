<h1>外墙墙皮已经松动，收口还能正常做吗？</h1>
<div class="meta">门窗问答 · 2026-11-14 · 一米阳光门窗</div>
<p>优先建议先处理松动墙皮，把基层加固平整之后再做收口。基层不稳，后期密封材料容易开裂脱落，渗水风险会持续存在。</p>
<p>如果有条件，跑一趟工厂看看型材和加工工序，心里会踏实很多。</p>
